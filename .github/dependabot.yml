version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      # One PR for all non-major npm updates; majors stay separate for review.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Bundled deep inside the `npm` CLI that semantic-release pulls in at
      # release time only. Dev-only (the shipped image is built with
      # --omit=dev) and not updatable from our manifest, so Dependabot's
      # security update for it can't succeed. Tracked via npm audit instead.
      - dependency-name: "picomatch"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      # One PR for all GitHub Actions updates.
      github-actions:
        patterns: ["*"]
