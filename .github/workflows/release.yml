name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Avoid overlapping releases.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create releases, tags and push the changelog commit
  issues: write # comment on released issues
  pull-requests: write # comment on released PRs
  packages: write # push the Docker image to GHCR
  id-token: write # keyless image signing with cosign
  security-events: write # upload the Trivy image scan (SARIF)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Gate the release on a green build + tests.
      - run: npm run build
      - run: npm test
      - name: Run semantic-release
        id: release
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          npx semantic-release
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          if [ "$after" != "$before" ] && [ "$after" != "none" ]; then
            echo "version=${after#v}" >> "$GITHUB_OUTPUT"
            echo "Released ${after}"
          else
            echo "No new release."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build and publish the Docker image to GHCR for the new version.
      - name: Set up QEMU
        if: steps.release.outputs.version != ''
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        if: steps.release.outputs.version != ''
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: steps.release.outputs.version != ''
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        if: steps.release.outputs.version != ''
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.release.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.release.outputs.version }}
            type=raw,value=latest
      - name: Build and push image
        if: steps.release.outputs.version != ''
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Install cosign
        if: steps.release.outputs.version != ''
        uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        if: steps.release.outputs.version != ''
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
      - name: Scan the image with Trivy
        if: steps.release.outputs.version != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
      - name: Upload Trivy results
        if: steps.release.outputs.version != ''
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image
