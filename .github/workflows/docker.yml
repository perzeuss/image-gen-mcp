name: Docker

# Manually build and publish a Docker image for an existing tag to GHCR.
# Useful to (re)build a release that wasn't built automatically, e.g. v1.0.0.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag to build (e.g. v1.0.0)"
        required: true
        default: v1.0.0

permissions:
  contents: read
  packages: write
  id-token: write # keyless image signing with cosign
  security-events: write # upload the Trivy image scan (SARIF)

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve version
        id: v
        run: echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
        env:
          REF: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }}
            type=semver,pattern={{major}},value=${{ inputs.ref }}
            type=raw,value=latest
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image
