name: Bug report
description: Report a problem with the MCP server
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure with ...
        2. Call generate_image with ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      options:
        - local disk
        - Cloudflare R2
    validations:
      required: false
  - type: input
    id: model
    attributes:
      label: IMAGE_MODEL
      placeholder: google/gemini-2.5-flash-image
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs (redact secrets!), including any `[oauth]` lines.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
